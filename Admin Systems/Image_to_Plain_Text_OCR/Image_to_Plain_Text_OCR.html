<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Image to Text OCR</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.app {
    width: 100%;
    max-width: 1000px;
    background: white;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

h1 {
    text-align: center;
    color: #1d4ed8;
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

.upload-area {
    display: block;
    width: 100%;
    border: 3px dashed #3b82f6;
    border-radius: 15px;
    padding: 45px 20px;
    text-align: center;
    background-color: #eff6ff;
    background-image: none;
    color: #1e40af;
    cursor: pointer;
    transition: background-color .2s ease, border-color .2s ease;
}

.upload-area:hover,
.upload-area:focus-within {
    background-color: #dbeafe;
    border-color: #1d4ed8;
}

.upload-area:focus-visible {
    outline: 3px solid rgba(37, 99, 235, .35);
    outline-offset: 4px;
}

.upload-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.upload-text {
    font-size: 20px;
    font-weight: bold;
    color: #1e40af;
}

.upload-info {
    margin-top: 8px;
    color: #64748b;
    font-size: 14px;
}

#imageInput {
    display: none;
}

.preview-container {
    width: 100%;
    min-height: 0;
    margin-top: 25px;
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    background-color: #f8fafc;
    background-image: none;
}

#preview {
    display: none;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: min(450px, 65vh);
    object-fit: contain;
    object-position: center;
    background-color: #ffffff;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

#status {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    text-align: center;
    border-radius: 8px;
    background: #f1f5f9;
    color: #475569;
    font-weight: bold;
}

.progress-container {
    width: 100%;
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#2563eb,#7c3aed);
    transition: width .2s;
}

.settings {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 20px;
}

.setting {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    padding: 10px 14px;
    border-radius: 8px;
}

.setting label {
    font-size: 14px;
    color: #334155;
}

select {
    margin-left: 6px;
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #cbd5e1;
}

.buttons {
    width: 100%;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 20px;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

#extractBtn {
    background: #2563eb;
}

#copyBtn {
    background: #16a34a;
}

#downloadBtn {
    background: #7c3aed;
}

#clearBtn {
    background: #dc2626;
}

.output-title {
    margin-top: 30px;
    margin-bottom: 10px;
    color: #1e293b;
}

#output {
    display: block;
    width: 100%;
    min-height: 300px;
    padding: 15px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    resize: vertical;
    outline: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.6;
}

#output:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}

@media(max-width:700px) {

    body {
        padding: 15px;
        align-items: flex-start;
    }

    .app {
        margin-top: 15px;
        padding: 20px;
    }

    h1 {
        font-size: 26px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<main class="app">

    <h1>📷 Advanced Image to Text OCR</h1>

    <p class="subtitle">
        Enhanced OCR for printed text, photos and handwriting
    </p>

    <label class="upload-area" for="imageInput">

        <div class="upload-icon">📁</div>

        <div class="upload-text">
            Click Here to Upload Image
        </div>

        <div class="upload-info">
            JPG • JPEG • PNG • WEBP
        </div>

    </label>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <div class="preview-container">
        <img id="preview" alt="Image Preview">
    </div>

    <div id="status">
        Select an image to begin.
    </div>

    <div class="progress-container" id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div class="settings">

        <div class="setting">
            <label>
                OCR Mode:
                <select id="ocrMode">
                    <option value="auto">Auto / Best</option>
                    <option value="printed">Printed Text</option>
                    <option value="handwriting">Handwriting</option>
                </select>
            </label>
        </div>

        <div class="setting">
            <label>
                Enhancement:
                <select id="enhanceMode">
                    <option value="auto">Automatic</option>
                    <option value="normal">Normal</option>
                    <option value="strong">Strong</option>
                </select>
            </label>
        </div>

    </div>

    <div class="buttons">

        <button id="extractBtn" disabled>
            🔍 Extract Text
        </button>

        <button id="copyBtn">
            📋 Copy
        </button>

        <button id="downloadBtn">
            💾 Download TXT
        </button>

        <button id="clearBtn">
            🗑 Clear
        </button>

    </div>

    <h2 class="output-title">
        Extracted Plain Text
    </h2>

    <textarea
        id="output"
        placeholder="Extracted text will appear here..."
    ></textarea>

</main>

<script>

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const extractBtn =
    document.getElementById("extractBtn");

const output =
    document.getElementById("output");

const status =
    document.getElementById("status");

const copyBtn =
    document.getElementById("copyBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const clearBtn =
    document.getElementById("clearBtn");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const ocrMode =
    document.getElementById("ocrMode");

const enhanceMode =
    document.getElementById("enhanceMode");

let selectedFile = null;


/* =====================================================
   IMAGE LOADING
===================================================== */

imageInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        alert("Please select a valid image.");

        return;
    }

    selectedFile = file;

    const reader = new FileReader();

    reader.onload = function (event) {
        if (typeof event.target.result !== "string") {
            status.textContent = "Unable to load this image. Please try another file.";
            return;
        }

        preview.onload = function () {
            preview.style.display = "block";
        };

        preview.onerror = function () {
            preview.style.display = "none";
            status.textContent = "Could not display this image. Please choose a valid JPG, PNG, or WEBP file.";
            extractBtn.disabled = true;
        };

        preview.src = event.target.result;
    };

    reader.readAsDataURL(file);

    output.value = "";

    extractBtn.disabled = false;

    status.textContent =
        "Image uploaded. Ready for enhanced OCR.";
});


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = reject;

        img.src = URL.createObjectURL(file);
    });
}


/* =====================================================
   CREATE PREPROCESSED CANVAS
===================================================== */

function preprocessImage(img, mode = "normal") {

    const canvas =
        document.createElement("canvas");

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently: true
        });

    /*
       Upscale small images.

       OCR performs much better when characters
       have enough pixels.
    */

    let scale = 1.5;

    if (img.width < 1200) {
        scale = 2;
    }

    if (img.width < 700) {
        scale = 3;
    }

    const maxWidth = 3000;

    let width =
        Math.round(img.width * scale);

    let height =
        Math.round(img.height * scale);

    /*
       Prevent extremely large canvases.
    */

    if (width > maxWidth) {

        const ratio =
            maxWidth / width;

        width = maxWidth;

        height =
            Math.round(height * ratio);
    }

    canvas.width = width;
    canvas.height = height;

    /*
       Draw with smoothing.
    */

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.drawImage(
        img,
        0,
        0,
        width,
        height
    );

    const imageData =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );

    const data =
        imageData.data;

    const strong =
        mode === "strong";

    /*
       Grayscale + contrast + sharpening-like
       local processing.
    */

    for (let i = 0; i < data.length; i += 4) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        /*
           Better luminance calculation.
        */

        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

        /*
           Increase contrast.
        */

        let contrast =
            strong ? 1.55 : 1.30;

        gray =
            ((gray - 128) * contrast) + 128;

        gray =
            Math.max(
                0,
                Math.min(255, gray)
            );

        /*
           Slight brightness normalization.
        */

        if (strong) {

            if (gray > 245) {
                gray = 255;
            }

            if (gray < 30) {
                gray = 0;
            }
        }

        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;
    }

    ctx.putImageData(imageData, 0, 0);

    /*
       Create a second thresholded version
       for difficult printed/handwritten text.
    */

    const thresholdCanvas =
        document.createElement("canvas");

    thresholdCanvas.width = width;
    thresholdCanvas.height = height;

    const tctx =
        thresholdCanvas.getContext("2d", {
            willReadFrequently: true
        });

    tctx.drawImage(canvas, 0, 0);

    const thresholdData =
        tctx.getImageData(
            0,
            0,
            width,
            height
        );

    const td =
        thresholdData.data;

    /*
       Adaptive-ish threshold.

       Instead of a single aggressive threshold,
       use a softer threshold so handwriting strokes
       are less likely to disappear.
    */

    const threshold =
        strong ? 165 : 180;

    for (let i = 0; i < td.length; i += 4) {

        const value = td[i];

        if (value < threshold) {

            td[i] = 0;
            td[i + 1] = 0;
            td[i + 2] = 0;

        } else {

            td[i] = 255;
            td[i + 1] = 255;
            td[i + 2] = 255;
        }
    }

    tctx.putImageData(
        thresholdData,
        0,
        0
    );

    return {
        gray: canvas,
        threshold: thresholdCanvas
    };
}


/* =====================================================
   CANVAS TO BLOB
===================================================== */

function canvasToBlob(canvas) {

    return new Promise(resolve => {

        canvas.toBlob(
            blob => resolve(blob),
            "image/png",
            1.0
        );
    });
}


/* =====================================================
   OCR SINGLE PASS
===================================================== */

async function recognizeImage(
    image,
    psm,
    label,
    totalPasses,
    currentPass
) {

    status.textContent =
        label;

    const result =
        await Tesseract.recognize(
            image,
            "eng",
            {
                logger: info => {

                    if (
                        info.status ===
                        "recognizing text"
                    ) {

                        const local =
                            Math.round(
                                info.progress * 100
                            );

                        const overall =
                            Math.round(
                                (
                                    (
                                        currentPass +
                                        info.progress
                                    ) /
                                    totalPasses
                                ) * 100
                            );

                        progressBar.style.width =
                            overall + "%";

                        status.textContent =
                            label +
                            " " +
                            local +
                            "%";
                    }
                },

                /*
                   Important OCR configuration.
                */

                tessedit_pageseg_mode: psm,

                preserve_interword_spaces: "1"
            }
        );

    return result;
}


/* =====================================================
   CLEAN OCR TEXT
===================================================== */

function cleanText(text) {

    if (!text) return "";

    return text

        /*
           Normalize line endings.
        */
        .replace(/\r/g, "")

        /*
           Remove excessive spaces.
        */
        .replace(/[ \t]+/g, " ")

        /*
           Remove excessive empty lines.
        */
        .replace(/\n{3,}/g, "\n\n")

        /*
           Trim whitespace.
        */
        .trim();
}


/* =====================================================
   SCORE OCR RESULT
===================================================== */

function scoreText(text) {

    if (!text) return 0;

    const cleaned =
        cleanText(text);

    if (!cleaned) return 0;

    let score = 0;

    /*
       More meaningful characters = better.
    */

    const letters =
        (cleaned.match(/[A-Za-z]/g) || [])
            .length;

    const numbers =
        (cleaned.match(/[0-9]/g) || [])
            .length;

    const spaces =
        (cleaned.match(/ /g) || [])
            .length;

    const badSymbols =
        (cleaned.match(
            /[^A-Za-z0-9\s.,!?'"():;/%$€£\-]/g
        ) || []).length;

    score += letters * 3;

    score += numbers * 2;

    score += spaces;

    score -= badSymbols * 3;

    /*
       Penalize extremely short results.
    */

    if (cleaned.length < 3) {
        score -= 20;
    }

    /*
       Reward normal word-like patterns.
    */

    const words =
        cleaned.split(/\s+/);

    for (const word of words) {

        if (
            /^[A-Za-z0-9.,!?'"()\-]+$/
                .test(word)
        ) {
            score += 2;
        }
    }

    return score;
}


/* =====================================================
   MERGE RESULTS
===================================================== */

function mergeResults(results) {

    const valid =
        results
            .map(cleanText)
            .filter(Boolean);

    if (!valid.length) {
        return "";
    }

    /*
       First select the result with the strongest
       OCR score.
    */

    valid.sort(
        (a, b) =>
            scoreText(b) -
            scoreText(a)
    );

    return valid[0];
}


/* =====================================================
   MAIN OCR
===================================================== */

extractBtn.addEventListener(
    "click",
    async function () {

        if (!selectedFile) return;

        extractBtn.disabled = true;

        progressContainer.style.display =
            "block";

        progressBar.style.width =
            "0%";

        output.value = "";

        try {

            status.textContent =
                "Loading image...";

            const img =
                await loadImage(
                    selectedFile
                );

            /*
               Preprocess the image.
            */

            const mode =
                enhanceMode.value === "strong"
                    ? "strong"
                    : "normal";

            status.textContent =
                "Enhancing image for OCR...";

            const processed =
                preprocessImage(
                    img,
                    mode
                );

            /*
               Convert canvases to blobs.
            */

            const grayBlob =
                await canvasToBlob(
                    processed.gray
                );

            const thresholdBlob =
                await canvasToBlob(
                    processed.threshold
                );

            const results = [];

            /*
               =================================================
               OCR STRATEGIES
               =================================================

               3 = Fully automatic page segmentation
               6 = One uniform block of text
               11 = Sparse text
               12 = Sparse text with OSD

               These different modes help with:
               - documents
               - notes
               - photographs
               - separated handwriting
            */

            let passes;

            if (ocrMode.value === "handwriting") {

                passes = [
                    {
                        image: grayBlob,
                        psm: 6,
                        label:
                            "Reading handwriting..."
                    },
                    {
                        image: grayBlob,
                        psm: 11,
                        label:
                            "Scanning handwriting..."
                    },
                    {
                        image: thresholdBlob,
                        psm: 6,
                        label:
                            "Enhancing handwriting..."
                    }
                ];

            } else if (
                ocrMode.value === "printed"
            ) {

                passes = [
                    {
                        image: grayBlob,
                        psm: 6,
                        label:
                            "Reading printed text..."
                    },
                    {
                        image: thresholdBlob,
                        psm: 6,
                        label:
                            "Reading high-contrast text..."
                    },
                    {
                        image: grayBlob,
                        psm: 3,
                        label:
                            "Analyzing document layout..."
                    }
                ];

            } else {

                /*
                   AUTO MODE
                */

                passes = [
                    {
                        image: grayBlob,
                        psm: 6,
                        label:
                            "Analyzing main text..."
                    },
                    {
                        image: grayBlob,
                        psm: 11,
                        label:
                            "Scanning sparse text..."
                    },
                    {
                        image: thresholdBlob,
                        psm: 6,
                        label:
                            "Analyzing enhanced text..."
                    },
                    {
                        image: thresholdBlob,
                        psm: 11,
                        label:
                            "Scanning enhanced layout..."
                    }
                ];
            }

            for (
                let i = 0;
                i < passes.length;
                i++
            ) {

                const pass =
                    passes[i];

                const result =
                    await recognizeImage(
                        pass.image,
                        pass.psm,
                        pass.label,
                        passes.length,
                        i
                    );

                if (
                    result &&
                    result.data &&
                    result.data.text
                ) {

                    results.push(
                        result.data.text
                    );
                }
            }

            /*
               Select strongest result.
            */

            const finalText =
                mergeResults(results);

            output.value =
                finalText;

            progressBar.style.width =
                "100%";

            if (finalText) {

                status.textContent =
                    "✅ OCR completed successfully.";

            } else {

                status.textContent =
                    "⚠️ No readable text was detected.";
            }

        }

        catch (error) {

            console.error(
                "OCR ERROR:",
                error
            );

            status.textContent =
                "❌ OCR failed.";

            alert(
                "OCR failed. Please try a clearer image."
            );
        }

        finally {

            extractBtn.disabled = false;
        }
    }
);


/* =====================================================
   COPY
===================================================== */

copyBtn.addEventListener(
    "click",
    async function () {

        if (!output.value.trim()) {

            alert(
                "There is no text to copy."
            );

            return;
        }

        try {

            await navigator.clipboard
                .writeText(output.value);

            status.textContent =
                "✅ Text copied.";

        }

        catch {

            output.select();

            document.execCommand(
                "copy"
            );

            status.textContent =
                "✅ Text copied.";
        }
    }
);


/* =====================================================
   DOWNLOAD
===================================================== */

downloadBtn.addEventListener(
    "click",
    function () {

        if (!output.value.trim()) {

            alert(
                "There is no text to download."
            );

            return;
        }

        const blob =
            new Blob(
                [output.value],
                {
                    type:
                        "text/plain;charset=utf-8"
                }
            );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            "extracted-text.txt";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
    }
);


/* =====================================================
   CLEAR
===================================================== */

clearBtn.addEventListener(
    "click",
    function () {

        selectedFile = null;

        imageInput.value = "";

        preview.src = "";

        preview.style.display =
            "none";

        output.value = "";

        extractBtn.disabled = true;

        progressContainer.style.display =
            "none";

        progressBar.style.width =
            "0%";

        status.textContent =
            "Select an image to begin.";
    }
);

</script>

</body>
</html>
